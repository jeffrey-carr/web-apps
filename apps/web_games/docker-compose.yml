services:
  web_games_frontend:
    image: ghcr.io/jeffrey-carr/web_games-frontend:latest
    container_name: web_games_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:5173:3000'

  web_games_backend:
    image: ghcr.io/jeffrey-carr/web_games-backend:latest
    container_name: web_games_backend
    volumes:
      - ./backend/docker.env:/app/.env:ro
    ports:
      - '127.0.0.1:8082:8080'
    restart: unless-stopped
